<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta lang="ru">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>УРАРТУ - Наши филиалы</title>
    <!-- Подключаем стили (вставим ниже) -->
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/filials.css">
    <link rel="stylesheet" href="./styles/contacts.css">
    <link rel="stylesheet" href="./styles/developers.css">
</head>

<body>
    <div class="grain-overlay"></div>
    <!-- Блок: filials -->
    <section id="filials">
        <!-- ===== ДЕКОРАТИВНЫЕ ГРАНАТЫ ===== -->
        <img class="filials__decoration filials__decoration--pomegranate-1" src="./assets/images/pomegranate-1.png"
            alt="Гранат">
        <img class="filials__decoration filials__decoration--pomegranate-2" src="./assets/images/pomegranate-2.png"
            alt="Гранат">

        <div class="filials__content">
            <!-- Заголовок блока -->
            <div class="filials-section__header">
                <h2 class="filials-section__title">
                    <span class="filials-section__title-part">Наши</span>
                    <span class="filials-section__title-part">Филиалы</span>
                </h2>

                <!-- Блок групп (элемент основного блока, но лучше сделать вложенным блоком, если сложный) -->
                <div class="filials-section__groups">
                    <div class="filials-section__group-item">
                        <span class="filials-section__group-dot red"></span>
                        <span class="filials-section__group-age">(14+)</span>
                        <span class="filials-section__group-name">старшая</span>
                    </div>
                    <div class="filials-section__group-item">
                        <span class="filials-section__group-dot yellow"></span>
                        <span class="filials-section__group-age">(9-13)</span>
                        <span class="filials-section__group-name">средняя</span>
                    </div>
                    <div class="filials-section__group-item">
                        <span class="filials-section__group-dot green"></span>
                        <span class="filials-section__group-age">(7-9)</span>
                        <span class="filials-section__group-name">младшая</span>
                    </div>
                </div>
            </div>
            <p class="filials__city">г. Ростов-на-Дону</p>
            <!-- Блок списка филиалов -->
            <div class="filials-section__cards">
                <div class="filials-section__card">
                    <div class="filials-section__card-map filials-section__card-map--color-1">
                        <a href="https://yandex.ru/maps/?um=constructor%3Aece54fbc80fcc3bd7a28978d5a01cb16ceb60d30ceb579a1d64f8fab81e5902e&amp;source=constructorStatic"
                            target="_blank"><img
                                src="https://api-maps.yandex.ru/services/constructor/1.0/static/?um=constructor%3Aece54fbc80fcc3bd7a28978d5a01cb16ceb60d30ceb579a1d64f8fab81e5902e&amp;width=350&amp;height=200&amp;lang=ru_RU"
                                alt="" style="border: 0;" /></a>
                    </div>
                    <div class="filials-section__card-info__wrapper">
                        <div class="filials-section__card-address"><b>Таганрогская 161, <br>Дом Офицеров</b></div>
                        <div class="filials-section__card-schedule">Суббота / Воскресенье </div>
                        <div class="filials-section__card-colors__wrapper">
                            <div class="filials-section__card-color red"></div>
                            <div class="filials-section__card-color yellow"></div>
                            <div class="filials-section__card-color green"></div>
                        </div>
                    </div>
                </div>

                <div class="filials-section__card">
                    <div class="filials-section__card-map filials-section__card-map--color-2"><a
                            href="https://yandex.ru/maps/?um=constructor%3A6dc34ad125ba02202c4a61613260cb11fdbab40c1a2d60afd7fc7b18eebd1723&amp;source=constructorStatic"
                            target="_blank"><img
                                src="https://api-maps.yandex.ru/services/constructor/1.0/static/?um=constructor%3A6dc34ad125ba02202c4a61613260cb11fdbab40c1a2d60afd7fc7b18eebd1723&amp;width=350&amp;height=200&amp;lang=ru_RU"
                                alt="" style="border: 0;" /></a></div>
                    <div class="filials-section__card-info__wrapper">
                        <div class="filials-section__card-address"><b>Измайловский 4, <br>Школа №75</b></div>
                        <div class="filials-section__card-schedule">Вторник / Четверг</div>
                        <div class="filials-section__card-colors__wrapper">
                            <div class="filials-section__card-color yellow"></div>
                            <div class="filials-section__card-color green"></div>
                        </div>
                    </div>
                </div>

                <div class="filials-section__card">
                    <div class="filials-section__card-map filials-section__card-map--color-3"><a
                            href="https://yandex.ru/maps/?um=constructor%3Add82e42ed9932e65891b05e396d4c0421c9d9c8c8791d399bacf73d52fa6602b&amp;source=constructorStatic"
                            target="_blank"><img
                                src="https://api-maps.yandex.ru/services/constructor/1.0/static/?um=constructor%3Add82e42ed9932e65891b05e396d4c0421c9d9c8c8791d399bacf73d52fa6602b&amp;width=350&amp;height=200&amp;lang=ru_RU"
                                alt="" style="border: 0;" /></a></div>
                    <div class="filials-section__card-info__wrapper">
                        <div class="filials-section__card-address"><b>Шаумяна 94, <br>Дом культуры</b></div>
                        <div class="filials-section__card-schedule">Пятница / Воскресенье</div>
                        <div class="filials-section__card-colors__wrapper">
                            <div class="filials-section__card-color green"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section id="contacts">
        <!-- ===== ДЕКОРАТИВНЫЕ ОБЛАКА ===== -->
        <div class="contacts__clouds">
            <img class="contacts__cloud--backgorund" src="./assets/images/white-clouds-background.svg" alt="">
            <img class="contacts__cloud contacts__cloud--1" src="./assets/images/cloud.png" alt="Облако">
            <img class="contacts__cloud contacts__cloud--2" src="./assets/images/cloud.png" alt="Облако">
            <img class="contacts__cloud contacts__cloud--3" src="./assets/images/cloud.png" alt="Облако">
            <img class="contacts__cloud contacts__cloud--4" src="./assets/images/cloud.png" alt="Облако">
            <img class="contacts__cloud contacts__cloud--5" src="./assets/images/cloud.png" alt="Облако">
            <img class="contacts__cloud contacts__cloud--6" src="./assets/images/cloud.png" alt="Облако">
            <img class="contacts__cloud contacts__cloud--7" src="./assets/images/cloud.png" alt="Облако">
        </div>

        <h2 class="contacts-section__title">
            <span class="contacts-section__title-part">Урарту</span>
            <span class="contacts-section__title-part">в соцсетях</span>
        </h2>

        <!-- Фоновые декорации -->
        <div class="footer__stars" src="./assets/images/stars.png" alt="Звёзды"></div>

        <!-- Блок с контактами -->
        <div class="footer__contacts">
            <a href="tel:+7(988)257-19-29" class="footer__cta-button">
                <svg class="footer__cta-icon width=" 50" height="50" viewBox="0 0 50 50" fill="currentColor"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M31.4624 35.9452L35.1567 32.2491C35.7253 31.6736 36.4022 31.2163 37.1483 30.9045C37.8946 30.5927 38.6952 30.4324 39.5037 30.4324C40.3126 30.4324 41.1131 30.5927 41.8595 30.9045C42.6056 31.2163 43.2825 31.6736 43.8508 32.2491L48.184 36.5843C48.7592 37.1529 49.2161 37.8295 49.5278 38.5762C49.8394 39.3225 50 40.1239 50 40.9328C50 41.742 49.8394 42.5432 49.5278 43.2898C49.2161 44.0362 48.7592 44.7128 48.184 45.2814L46.2118 47.2821C44.853 48.6548 43.0955 49.5635 41.1901 49.8778C39.2846 50.1921 37.3285 49.8967 35.6011 49.033C20.7358 41.3777 8.62792 29.2744 0.963632 14.4096C0.0995819 12.6795 -0.193796 10.72 0.125636 8.81263C0.445068 6.90526 1.36087 5.14818 2.7414 3.79438L4.71343 1.79374C5.86875 0.644929 7.43155 0 9.06049 0C10.6894 0 12.2522 0.644929 13.4075 1.79374L17.7685 6.1566C18.9169 7.31241 19.5614 8.87565 19.5614 10.5053C19.5614 12.1349 18.9169 13.6981 17.7685 14.8539L14.0742 18.5499C16.5169 21.8553 19.2 24.9757 22.1016 27.8862C24.9865 30.7772 28.0881 33.4437 31.379 35.8618L31.4624 35.9452Z"
                        fill="currentColor" />
                </svg>
                <span class="footer__cta-text">Связаться с нами</span>
            </a>

            <!-- Социальные сети -->
            <div class="footer__socials">
                <a href="https://www.instagram.com/ensemble__urartu" class="footer__social-link" aria-label="Instagram">
                    <img src="./assets/images/instagram.svg" alt="Instagram">
                </a>
                <a href="https://t.me/urartustsil" class="footer__social-link" aria-label="Telegram">
                    <img src="./assets/images/telegram.svg" alt="Telegram">
                </a>
                <a href="#" class="footer__social-link footer__social-link-tiktok" aria-label="TikTok">
                    <img src="./assets/images/tiktok.svg" alt="TikTok">
                </a>
                <a href="https://ru.pinterest.com/ensemble_urartu" class="footer__social-link" aria-label="Pinterest">
                    <img src="./assets/images/pinterest.svg" alt="Pinterest">
                </a>
            </div>
        </div>

        <!-- Основное содержимое -->
        <div>
            <div class="footer__inner">
                <div class="footer__end-immages">
                    <img class="footer__moon" src="./assets/images/moon.png" alt="Луна">
                    <!-- Фото ансамбля -->
                    <img class="footer__ensemble-image" src="./assets/images/ensemble-urartu.png" alt="Ансамбль Урарту">
                </div>
            </div>
            <footer class="developers__footer">
                <div class="developers__icons">
                    <a class="developers__footer-link developers__footer--what" href="#">
                        <img class="developers__footer-icon" src="./assets/images/WHAT.svg" alt="Иконка">
                    </a>
                    <img class="developers__footer--x" src="./assets/images/x.svg" alt="#">
                    <a class="developers__footer-link" href="#">
                        <img class="developers__footer-icon" src="./assets/images/URARTU Team.svg" alt="Иконка">
                    </a>
                </div>
            </footer>
        </div>
    </section>
</body>

</html>
