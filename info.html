<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши филиалы</title>
    <!-- Подключаем стили (вставим ниже) -->
    <link rel="stylesheet" href="styles/filials.css">
    <link rel="stylesheet" href="styles/director.css">
</head>
<body>

    <!-- Блок: filials-section -->
    <section class="filials-section">
        
        <!-- Заголовок блока -->
        <div class="filials-section__header">
            <h2 class="filials-section__title">
                <span class="filials-section__title-part">Наши</span><br>
                <span class="filials-section__title-part filials-section__title-part--brown">Филиалы</span>
            </h2>
        </div>

        <!-- Блок групп (элемент основного блока, но лучше сделать вложенным блоком, если сложный) -->
        <div class="filials-section__groups">
            <div class="filials-section__group-item">
                <span class="filials-section__group-dot filials-section__group-dot--red"></span>
                <span class="filials-section__group-age">(14+)</span>
                <span class="filials-section__group-name">старшая</span>
            </div>
            <div class="filials-section__group-item">
                <span class="filials-section__group-dot filials-section__group-dot--yellow"></span>
                <span class="filials-section__group-age">(9-13)</span>
                <span class="filials-section__group-name">средняя</span>
            </div>
            <div class="filials-section__group-item">
                <span class="filials-section__group-dot filials-section__group-dot--green"></span>
                <span class="filials-section__group-age">(7-9)</span>
                <span class="filials-section__group-name">младшая</span>
            </div>
        </div>

        <!-- Блок списка филиалов -->
        <div class="filials-section__cards">
            
            <div class="filials-section__card">
                <div class="filials-section__card-map filials-section__card-map--color-1"></div>
                <div class="filials-section__card-address">бул. Измайловский 4,<br>школа №75</div>
                <div class="filials-section__card-schedule">Вторник | Четверг</div>
            </div>

            <div class="filials-section__card">
                <div class="filials-section__card-map filials-section__card-map--color-2"></div>
                <div class="filials-section__card-address">бул. Измайловский 4,<br>школа №75</div>
                <div class="filials-section__card-schedule">Вторник | Четверг</div>
            </div>

            <div class="filials-section__card">
                <div class="filials-section__card-map filials-section__card-map--color-3"></div>
                <div class="filials-section__card-address">бул. Измайловский 4,<br>школа №75</div>
                <div class="filials-section__card-schedule">Вторник | Четверг</div>
            </div>

        </div>
    </section>
    <section id="contacts">;
<!-- ===== ДЕКОРАТИВНЫЕ ОБЛАКА ===== -->
            <div class="contacts__clouds">
                <img class="director__cloud--backgorund" src="./assets/images/white-clouds-background.svg" alt="">
                <img class="director__cloud director__cloud--1" src="./assets/images/cloud.png" alt="Облако">
                <img class="director__cloud director__cloud--2" src="./assets/images/cloud.png" alt="Облако">
                <img class="director__cloud director__cloud--3" src="./assets/images/cloud.png" alt="Облако">
                <img class="director__cloud director__cloud--4" src="./assets/images/cloud.png" alt="Облако">
                <img class="director__cloud director__cloud--5" src="./assets/images/cloud.png" alt="Облако">
                <img class="director__cloud director__cloud--6" src="./assets/images/cloud.png" alt="Облако">
                <img class="director__cloud director__cloud--7" src="./assets/images/cloud.png" alt="Облако">
            </div>

    </section>

</body>
</html>
